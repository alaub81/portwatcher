name: Release (build & push)

'on':
  push:
    tags:
      - 'v*.*.*'            # SemVer-Tags
  workflow_dispatch:
    inputs:
      rebuild_tags:
        description: 'Rebuild last N tags'
        required: false
        default: false
        type: boolean
      num_tags:
        description: 'How many recent tags to rebuild'
        required: false
        default: 1
        type: number
  schedule:
    - cron: '0 1 * * 2'     # Dienstag 01:00 UTC

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: release-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: false

jobs:
  # (A) TAG-REBUILD: nur bei Cron oder manuell (rebuild_tags=true)
  select-tags:
    if: ${{ github.event_name == 'schedule' || inputs.rebuild_tags }}
    runs-on: ubuntu-latest
    outputs:
      tags_json: ${{ steps.out.outputs.tags_json }}
      latest_tag: ${{ steps.out.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: out
        shell: bash
        run: |
          set -euo pipefail

          num="${{ inputs.num_tags }}"
          [ -z "${num}" ] && num=1

          TAGS="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n "${num}")"
          printf 'Selected tags:\n%s\n' "${TAGS}"

          # Tags als JSON
          JSON_TAGS="$(printf '%s\n' "${TAGS}" | jq -R . | jq -s -c .)"
          echo "tags_json=${JSON_TAGS}" >> "$GITHUB_OUTPUT"

          # NEUSTER Tag (erste Zeile der sortierten Liste)
          LATEST_TAG="$(printf '%s\n' "${TAGS}" | head -n 1)"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

  rebuild:
    needs: select-tags
    if: ${{ needs.select-tags.outputs.tags_json != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.select-tags.outputs.tags_json) }}
        image:
          - name: 'portwatcher'
            dockerfile: 'resources/portwatcher/Dockerfile'
            context: 'resources/portwatcher'

    steps:
      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.tag }}
          fetch-depth: 0

      - name: Resolve image build context
        id: build_paths
        env:
          DOCKERFILE: ${{ matrix.image.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.image.context }}
        shell: bash
        run: |
          set -euo pipefail
          dockerfile="$DOCKERFILE"
          context="$BUILD_CONTEXT"
          # Historical tags still use the previous root-level build context.
          if [[ ! -f "$dockerfile" ]]; then
            dockerfile=Dockerfile
            context=.
          fi
          test -f "$dockerfile"
          test -d "$context"
          {
            echo "dockerfile=$dockerfile"
            echo "context=$context"
          } >> "$GITHUB_OUTPUT"

      - name: Compute semver tags (strip v + major/minor)
        id: semver
        shell: bash
        run: |
          set -euo pipefail
          v="${{ matrix.tag }}"
          v="${v#v}"                 # v1.45.1 -> 1.45.1

          IFS='.' read -r major minor patch extra <<< "$v"
          if [[ -z "${major:-}" || -z "${minor:-}" || -z "${patch:-}" ]]; then
            echo "Tag is not x.y.z: '$v'" >&2
            exit 1
          fi

          echo "full=$v"           >> "$GITHUB_OUTPUT"   # 1.45.1
          echo "minor=$major.$minor" >> "$GITHUB_OUTPUT" # 1.45
          echo "major=$major"      >> "$GITHUB_OUTPUT"   # 1

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta (rebuild tag + aliases)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ steps.semver.outputs.full }}
            type=raw,value=${{ steps.semver.outputs.minor }}
            type=raw,value=${{ steps.semver.outputs.major }}
            type=raw,value=latest,enable=${{ matrix.tag == needs.select-tags.outputs.latest_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

      # Pre-build (amd64) zum Scannen, nicht pushen
      - name: Build (scan image)
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.build_paths.outputs.context }}
          file: ${{ steps.build_paths.outputs.dockerfile }}
          pull: true               # aktualisiert Base-Image
          push: false
          load: true
          platforms: linux/amd64
          tags: scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy FS (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: false
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy Image (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:${{ github.sha }}
          format: sarif
          output: trivy-rebuild.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Trivy Image (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload SARIF
        if: >-
          ${{ always() && github.event.repository.private == false &&
              hashFiles('trivy-fs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs-rebuild-${{ matrix.image.name }}-${{ matrix.tag }}

      - name: Upload SARIF
        if: >-
          ${{ always() && github.event.repository.private == false &&
              hashFiles('trivy-rebuild.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-rebuild.sarif
          category: trivy-image-rebuild-${{ matrix.image.name }}-${{ matrix.tag }}

      - name: Build & Push (multi-arch, overwrite tag)
        if: ${{ success() }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.build_paths.outputs.context }}
          file: ${{ steps.build_paths.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # (B) KLASSISCHER RELEASE: nur bei Tag-Push
  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: 'portwatcher'
            dockerfile: 'resources/portwatcher/Dockerfile'
            context: 'resources/portwatcher'

    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta (semver without v + latest)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            # nimmt v1.2.3 und macht 1.2.3
            type=semver,pattern={{version}},prefix=
            type=semver,pattern={{major}}.{{minor}},prefix=
            type=semver,pattern={{major}},prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

      # Pre-build (amd64) zum Scannen
      - name: Pre-build (load for scan)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          pull: true
          push: false
          load: true
          platforms: linux/amd64
          tags: scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Image (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:${{ github.sha }}
          format: sarif
          output: trivy-release.sarif
          exit-code: '0'
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false

      - name: Trivy Image (enforce severity)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload SARIF
        if: >-
          ${{ always() && github.event.repository.private == false &&
              hashFiles('trivy-release.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-release.sarif
          category: trivy-image-release-${{ matrix.image.name }}

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
